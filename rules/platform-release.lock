# ISR Bot platform release list (item 8, roadmap row 8 / R3).
#
# The sha256 of every file a vendor ships in the platform's own skill folders, by its path under the home folder.
# A file whose path and exact bytes are listed here is the vendor's (the owner's decision, Oct 18: nothing on the computer
# approves a platform file: no owner's yes, no record).
# The middle path (the owner's decision, Oct 22): versions differ per user, so this list can't be the only trust. A new
# or changed file at a path that already exists (a line here with any hash, or a baseline line), or in a new platform skill
# folder, that ISR Bot's rules find nothing in and no two scanners name a dangerous behavior in, is the quiet "Platform
# refresh" line and rolls into the baseline on the next full audit. Anything else is a counted high alert until a release
# lists it: a loose file, a link in or out, a colon in its path, a file over 1 MB, binary or flagged.
#
# This file ships with ISR Bot's release: it is listed in MANIFEST.sha256 and an installed copy is held to that line,
# so it is exactly as trustworthy as isr.py itself. None of the vendors publishes these hashes, and anything inside the
# home folder is the Bot's to write, so they should come from a freshly created computer no Bot has run on yet. The one
# accepted exception is the Oct 18 fill below; a clean computer is preferred for every later fill.
#
# The platform's own sync bookkeeping is never listed: it is rewritten at every sync with no release, and nothing reads it.
# The rule is isr.py's platform_churn_file, and the fill command below tests exactly the same things: the path is
# PLATFORM_CHURN's one name (the -regex below is that same pattern: the .bucket-<id>_<id> marker directly in
# .claude/plugins/synced, whose existence Claude's plugin discovery tests and whose contents it never reads), a regular
# file, not a link, no exec bit, one name (-links 1: no hardlink), and its real path is that same path under the real home
# folder (no link in a folder above it). Anything else in those folders is listed: managed-skills/cache.json too (the host
# builds its skill list and the Run-now prompt from it), the plugin buckets' *.meta.json, manifest.json and
# .marketplaces.json (Claude's plugin loader reads them to decide what loads), and .grok/bundled/manifest.json.
# ISR Bot checks two home folders, the home folder and /home/box; when they differ, run the command from each (the
# second with HOME=/home/box). A file is bookkeeping when the fill from one of them skips it, so a home folder inside
# /home/box gets the same answer from isr.py as from the fill run in it.
#
# Format: `sha256sum` output, run from the home folder on relative paths:
#   <sha256>  <path under the home folder>
# A metadata file rules/platform-normalize.json names may instead be listed by its canonical form (batch 6), on a line that
# says so: `canonical <sha256>  <path>` (scripts/platform-json-shape.py --canonical prints it). That line vouches for the file
# only after ISR Bot normalized it and checked every unit; a file whose own bytes hash to it is not listed by it.
# Paths must sit inside one of these folders: .grok/bundled, sand-data/managed-skills, agent-data/managed-skills,
# .codex/skills/.system, .claude/plugins/synced. One malformed line (a bad hash, a path from /, "..", a colon, or a
# path outside those folders) makes the whole list unusable, and the audit says so; so does an unusable list turn the
# middle path off.
# Placeholder: each account syncs Claude's plugins into its own bucket, a folder named <id>_<id> right under
# .claude/plugins/synced. A line for `.claude/plugins/synced/<bucket>/<path>` lists <path> in every such bucket. <bucket>
# is the only placeholder and only that folder may be one; any other < or > makes the whole list unusable.
#
# To fill it, on a freshly created computer before any Bot runs:
#   cd ~ && find .grok/bundled sand-data/managed-skills agent-data/managed-skills .codex/skills/.system \
#     .claude/plugins/synced -regextype posix-extended -type f ! \( ! -perm /111 -links 1 -regex \
#     '\.claude/plugins/synced/\.bucket-[0-9a-f-]{36}_[0-9a-f-]{36}' \
#     -exec sh -c '[ "$(realpath "$1")" = "$(pwd -P)/$1" ]' _ {} \; \) -exec sha256sum {} + 2>/dev/null \
#     >> <checkout>/rules/platform-release.lock
# Fill into a scratch file instead of the lock, put it through
#   sed -E 's#(\.claude/plugins/synced/)[0-9a-f-]{36}_[0-9a-f-]{36}/#\1<bucket>/#'
# so no account's bucket ids are listed, and append what it prints here,
# then run `bash scripts/make-manifest.sh` and publish a release. Several releases may list the same path.
#
# Filled Oct 18 from a maintainer box (not freshly created, accepted Oct 18) with the command as it was then (no bookkeeping
# skip): 623 entries. PR #9 removed its one bookkeeping line (the .bucket- marker), leaving 622. Bots had already run on that
# box, so these hashes are what was on it then, not a clean vendor install.
# Oct 20 (DQ-046(b)): 2 lines added for sign-in/SKILL.md b06512e7, leaving 624.
# Oct 22 (b8i4, the middle path): 33 lines removed for that box's plugin sync bucket (its <id>_<id> folder), leaving 591.
# 13 lines added back as <bucket> lines with the same hashes, leaving 604. They are cowork-plugin-management's 10 files (the
# vendor's own plugin, the same bytes in every account at one version) and the bucket's manifest.json, .marketplaces.json and
# cowork-plugin-management.meta.json. Those 3 byte-match only that box, but their lines make the paths "already existing"
# in every account's bucket, so a clean version there is the quiet line, not 3 counted highs on every first run. The other
# 20 lines, for a third-party plugin in that bucket, are gone: its files are held like any other unlisted platform file.
