# Watchtower platform release list (item 8, roadmap row 8 / R3).
#
# The sha256 of every file a vendor ships in the platform's own skill folders, by its path under the home folder.
# A new or changed file in one of those folders is a platform update (the quiet "Platform refresh" Tip) only when its
# path and its exact bytes are listed here. Anything else is a counted high alert until the owner says yes to those
# exact bytes in `wt.py fix`.
#
# This file ships with Watchtower's release: it is listed in MANIFEST.sha256 and an installed copy is held to that line,
# so it is exactly as trustworthy as wt.py itself. None of the vendors publishes these hashes, and anything inside the
# home folder is the Bot's to write, so they can only come from a computer no Bot has run on yet.
#
# Format: `sha256sum` output, run from the home folder on relative paths:
#   <sha256>  <path under the home folder>
# Paths must sit inside one of these folders: .grok/bundled, sand-data/managed-skills, agent-data/managed-skills,
# .codex/skills/.system, .claude/plugins/synced. One malformed line (a bad hash, a path from /, "..", a colon, or a
# path outside those folders) makes the whole list unusable, and the audit says so.
#
# To fill it, on a freshly created computer before any Bot runs:
#   cd ~ && find .grok/bundled sand-data/managed-skills agent-data/managed-skills .codex/skills/.system \
#     .claude/plugins/synced -type f -exec sha256sum {} + 2>/dev/null >> <checkout>/rules/platform-release.lock
# then run `bash scripts/make-manifest.sh` and publish a release. Several releases may list the same path.
#
# No entries yet: every new or changed platform file is a high alert until the owner's yes.
